<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="sealKm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#bgKm)"/>
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="#E2E8F0" stroke-width="8" rx="16"/>
  <rect x="36" y="36" width="728" height="488" fill="none" stroke="#059669" stroke-width="2" rx="12" stroke-dasharray="8 4"/>

  <text x="400" y="85" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#059669" letter-spacing="3">KEMENTERIAN PENDIDIKAN, KEBUDAYAAN, RISET, DAN TEKNOLOGI</text>
  <text x="400" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="1.5">DIREKTORAT JENDERAL PENDIDIKAN TINGGI, RISET, DAN TEKNOLOGI</text>

  <text x="400" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="1">PIAGAM PENGHARGAAN</text>
  <text x="400" y="185" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#059669" letter-spacing="2">NO. REG: KM7-KEMDIKBUD-2024</text>
  <line x1="280" y1="205" x2="520" y2="205" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="400" y="240" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#64748B">Diberikan sebagai penghargaan kepada:</text>
  <text x="400" y="280" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="0.5">MUHAMMAD RAFI RIZQI</text>
  
  <text x="400" y="320" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#475569">Atas dedikasi dan kontribusi aktif sebagai Mahasiswa Peserta Program:</text>
  
  <rect x="180" y="340" width="440" height="44" rx="22" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="400" y="367" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#047857">KAMPUS MENGAJAR ANGKATAN 7 TAHUN 2024</text>

  <text x="400" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="500" fill="#64748B">Penugasan: SDN 3 Way Laga, Bandar Lampung · Program MBKM Kemendikbudristek RI</text>

  <g transform="translate(100, 420)">
    <circle cx="40" cy="40" r="36" fill="url(#sealKm)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.15))"/>
