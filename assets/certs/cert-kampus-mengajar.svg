    <text x="80" y="62" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0F172A">Kemendikbudristek RI</text>
    <text x="80" y="78" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748B">Terverifikasi Resmi 2024</text>
