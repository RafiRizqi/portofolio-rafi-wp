<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHima" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8faff"/>
    </linearGradient>
    <linearGradient id="sealHima" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="goldHima" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bgHima)"/>
  
  <!-- Outer Double Borders -->
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="#E2E8F0" stroke-width="8" rx="16"/>
  <rect x="36" y="36" width="728" height="488" fill="none" stroke="#4F46E5" stroke-width="2" rx="12" stroke-dasharray="8 4"/>

  <!-- Corner Golden Ornaments -->
  <path d="M48 76 L48 48 L76 48" fill="none" stroke="#D97706" stroke-width="4"/>
  <path d="M752 76 L752 48 L724 48" fill="none" stroke="#D97706" stroke-width="4"/>
  <path d="M48 484 L48 512 L76 512" fill="none" stroke="#D97706" stroke-width="4"/>
  <path d="M752 484 L752 512 L724 512" fill="none" stroke="#D97706" stroke-width="4"/>

  <!-- Header / Organization -->
  <text x="400" y="85" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="3">UNIVERSITAS PAMULANG · FAKULTAS ILMU KOMPUTER</text>
  <text x="400" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="1.5">HIMPUNAN MAHASISWA TEKNIK INFORMATIKA (HIMTIF)</text>

  <!-- Title: SERTIFIKAT -->
  <text x="400" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800" fill="#0F172A" letter-spacing="3">SERTIFIKAT</text>
  <text x="400" y="185" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#D97706" letter-spacing="2">NO. REG: SK-HIMTIF-UNPAM-2025</text>
  <line x1="280" y1="205" x2="520" y2="205" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Recipient -->
  <text x="400" y="240" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#64748B">Diberikan sebagai bentuk penghargaan dan pengakuan kepada:</text>
  <text x="400" y="280" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="0.5">MUHAMMAD RAFI RIZQI</text>
  
  <text x="400" y="320" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#475569">Atas dedikasi, loyalitas, dan kepemimpinan luar biasa sebagai:</text>
  
  <!-- Role Pill -->
  <rect x="150" y="340" width="500" height="44" rx="22" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="400" y="367" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#3730A3" letter-spacing="0.5">KETUA UMUM HIMTIF PERIODE 2024 – 2025</text>

  <text x="400" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="500" fill="#64748B">Berhasil memimpin 30 pengurus &amp; 60 anggota dengan pencapaian realisasi 100% program kerja.</text>

  <!-- Official Seal -->
  <g transform="translate(100, 420)">
    <circle cx="40" cy="40" r="36" fill="url(#sealHima)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.15))"/>
    <circle cx="40" cy="40" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="40" y="35" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF">HIMTIF</text>
    <text x="40" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF">UNPAM</text>
  </g>

  <!-- Signatures / Verification -->
  <g transform="translate(560, 435)">
    <line x1="0" y1="45" x2="160" y2="45" stroke="#0F172A" stroke-width="1.5"/>
    <text x="80" y="62" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0F172A">Kaprodi Teknik Informatika</text>
    <text x="80" y="78" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748B">Universitas Pamulang</text>
  </g>
</svg>
