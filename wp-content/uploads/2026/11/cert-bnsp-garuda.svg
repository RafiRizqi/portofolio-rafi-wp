<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bgGrad)"/>
  
  <!-- Outer Double Border -->
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="#E2E8F0" stroke-width="8" rx="16"/>
  <rect x="36" y="36" width="728" height="488" fill="none" stroke="#2563EB" stroke-width="2" rx="12" stroke-dasharray="8 4"/>

  <!-- Corner Ornaments -->
  <path d="M48 76 L48 48 L76 48" fill="none" stroke="#D97706" stroke-width="4"/>
  <path d="M752 76 L752 48 L724 48" fill="none" stroke="#D97706" stroke-width="4"/>
  <path d="M48 484 L48 512 L76 512" fill="none" stroke="#D97706" stroke-width="4"/>
  <path d="M752 484 L752 512 L724 512" fill="none" stroke="#D97706" stroke-width="4"/>

  <!-- Header / Issuer -->
  <text x="400" y="85" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="3">REPUBLIK INDONESIA · BADAN NASIONAL SERTIFIKASI PROFESI</text>
  <text x="400" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="1.5">LEMBAGA SERTIFIKASI PROFESI UNIVERSITAS PAMULANG</text>

  <!-- Title -->
  <text x="400" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="1">SERTIFIKAT KOMPETENSI</text>
  <text x="400" y="185" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#D97706" letter-spacing="2">NO. REG: BNSP-LSP-GARUDA-2025</text>

  <line x1="280" y1="205" x2="520" y2="205" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Recipient -->
  <text x="400" y="240" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#64748B">Dengan ini menyatakan bahwa:</text>
  <text x="400" y="280" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="0.5">MUHAMMAD RAFI RIZQI</text>
  
  <text x="400" y="320" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#475569">Telah dinyatakan KOMPETEN pada Skema Sertifikasi:</text>
  
  <!-- Qualification Badge -->
  <rect x="220" y="340" width="360" height="44" rx="22" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="400" y="367" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#1D4ED8">SKEMA PEMROGRAMAN (PREDIKAT GARUDA)</text>

  <!-- Details / Standards -->
  <text x="400" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="500" fill="#64748B">Mengacu pada Standar Kompetensi Kerja Nasional Indonesia (SKKNI) Bidang Teknologi Informasi</text>

  <!-- Gold Seal -->
  <g transform="translate(100, 420)">
    <circle cx="40" cy="40" r="36" fill="url(#goldGrad)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.15))"/>
    <circle cx="40" cy="40" r="30" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="40" y="35" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF" letter-spacing="1">BNSP</text>
    <text x="40" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF">GARUDA</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(560, 435)">
    <line x1="0" y1="45" x2="160" y2="45" stroke="#0F172A" stroke-width="1.5"/>
    <text x="80" y="62" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0F172A">LSP Universitas Pamulang</text>
    <text x="80" y="78" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748B">Terverifikasi Resmi 2025</text>
  </g>
</svg>
